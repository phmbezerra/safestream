<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeStream · Server-enforced Media Lab</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial;background:#0b1120;color:#e2e8f0}main{max-width:960px;margin:35px auto;padding:15px}section{background:#172033;border:1px solid #34445f;border-radius:12px;padding:18px;margin:15px 0}h1{color:#93c5fd}input,button{padding:10px;margin:4px;border-radius:6px}input{background:#0b1120;color:white;border:1px solid #50617d}button{background:#507fe0;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}img{width:100%;max-width:640px;background:black;min-height:200px;object-fit:contain}.notice{color:#fbbf24}pre{white-space:pre-wrap;word-break:break-word}small{color:#b7c4dc}
</style></head><body><main><h1>SafeStream · Server-enforced JPEG Lab</h1><p class="notice">Experimental server-mediated JPEG frames, NOT an SFU or production WebRTC. No end-to-end encryption; the local gateway can access image frames. Use synthetic test material.</p>
<section><h2>1 · Local identity</h2><input id="name" value="Alice" aria-label="Test name"><button id="login">Create demo identity</button><div id="identity"></div></section>
<section><h2>2 · Room</h2><button id="create">Create publisher room</button><input id="room" placeholder="Room ID"><input id="invite" placeholder="One-use invite"><button id="join">Join as viewer</button><button id="makeinvite">Generate invitation</button><p id="members"></p><p id="invcode"></p><button id="revoke">Revoke viewer from server</button></section>
<section><h2>3 · Media gateway</h2><button id="connect">Connect relay</button><button id="start">Start synthetic moving frames</button><button id="stop">Stop publishing</button><p><label><input type="checkbox" id="ignore">Ignore revocation UI notification (test only)</label></p><img id="preview" alt="Received test image"><canvas id="canvas" width="480" height="270" hidden></canvas><p id="status">No frames yet</p></section>
<section><h2>Event log</h2><pre id="log"></pre></section>
<script>
const $=id=>document.getElementById(id);const base='http://127.0.0.1:3001';let secret='',me=null,roomId='',ws=null,interval=null,received=0,revokedAt=null,lastReceived=null,role='';
function log(s){$('log').textContent=new Date().toLocaleTimeString()+' '+s+'\n'+$('log').textContent}
async function api(method,path,body){const r=await fetch(base+path,{method,headers:{'Content-Type':'application/json',...(secret?{Authorization:'Bearer '+secret}:{})},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||r.status);return data}
function action(fn){return async()=>{try{await fn()}catch(e){log('ERROR: '+e.message)}}}
$('login').onclick=action(async()=>{const r=await api('POST','/api/sessions',{label:$('name').value});secret=r.secret;me=r.user;$('identity').textContent='Logged in as '+me.label;log('Identity created')});
async function refresh(){const r=await api('GET','/api/rooms/'+roomId);role=r.role;$('members').textContent=r.members.map(x=>x.label+' ('+x.role+')').join(' · ');return r}
$('create').onclick=action(async()=>{if(!secret)throw Error('Create identity first');const r=await api('POST','/api/rooms');roomId=r.roomId;$('room').value=roomId;await refresh();log('Room created: '+roomId)});
$('join').onclick=action(async()=>{roomId=$('room').value;await api('POST','/api/rooms/'+roomId+'/join',{invite:$('invite').value});await refresh();log('Joined room')});
$('makeinvite').onclick=action(async()=>{const r=await api('POST','/api/rooms/'+roomId+'/invites');$('invcode').textContent='Copy viewer invite: '+r.invite;log('Invite created')});
$('revoke').onclick=action(async()=>{const r=await refresh();const viewer=r.members.find(m=>m.role==='viewer');if(!viewer)throw Error('No viewer in room');await api('DELETE','/api/rooms/'+roomId+'/members/'+viewer.id);await refresh();log('Server revoked '+viewer.label)});
$('connect').onclick=action(async()=>{if(!secret||!roomId)throw Error('Login and join/create room first');if(ws)ws.close();ws=new WebSocket('ws://127.0.0.1:3001/media');ws.onopen=()=>ws.send(JSON.stringify({type:'auth',token:secret,roomId}));ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='ready'){role=m.role;log('Media ready: '+role)}else if(m.type==='frame'){received++;lastReceived=Date.now();$('preview').src=m.jpeg;$('status').textContent=`Frames received: ${received}; last seq: ${m.seq}; last frame: ${new Date(lastReceived).toLocaleTimeString()}; after-revoke samples: ${revokedAt&&lastReceived>revokedAt?'check server event':'n/a'}`;}else if(m.type==='revoked'){revokedAt=Date.now();log('Server revocation notice received');if(!$('ignore').checked){$('preview').removeAttribute('src')}else{log('UI ignores notice; transport still controlled by server')}}else if(m.type==='error')log('Relay error: '+m.error)};ws.onclose=e=>{clearInterval(interval);interval=null;log('Relay CLOSED code='+e.code+' (new frames impossible on this socket)');$('status').textContent+=` · socket closed ${e.code}`};});
$('start').onclick=action(async()=>{if(role!=='publisher'||ws?.readyState!==1)throw Error('Connect publisher relay first');clearInterval(interval);let i=0;const c=$('canvas'),ctx=c.getContext('2d');interval=setInterval(()=>{if(ws?.readyState!==1){clearInterval(interval);return}ctx.fillStyle='#142237';ctx.fillRect(0,0,480,270);ctx.fillStyle='#60a5fa';ctx.fillRect((i*13)%430+8,90,45,45);ctx.fillStyle='white';ctx.font='22px sans-serif';ctx.fillText('Synthetic frame '+i,25,40);i++;ws.send(JSON.stringify({type:'frame',jpeg:c.toDataURL('image/jpeg',.55)}));$('status').textContent='Sending synthetic frames '+i},250);log('Synthetic frames started')});
$('stop').onclick=()=>{clearInterval(interval);interval=null;log('Publisher stopped')};
window.addEventListener('beforeunload',()=>{clearInterval(interval);ws?.close()});
</script></main></body></html>
